name: Windows C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      # 1. Download the repository onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Locate MSBuild and compile the C++ application.
      - name: Build C++ application
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio C++ build tools were not found."
          }

          $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"

          $outputDir = Join-Path $env:GITHUB_WORKSPACE "output"
          New-Item -ItemType Directory -Force $outputDir | Out-Null

          & $msbuild ".\FirstVisualStudioProject\FirstVisualStudioProject.vcxproj" /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$outputDir\" /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 3. Preserve the executable as a downloadable artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Process-Monitor
          path: output/*.exe
          if-no-files-found: error
          retention-days: 14